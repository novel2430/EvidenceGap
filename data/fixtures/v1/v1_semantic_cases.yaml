- case_id: V1-01-ATOMIC-BOUNDARY
  synthetic: true
  focus: Atomic Claim 拆分边界
  input_text: 药物D在模拟试验中降低了症状评分且未增加严重不良事件，因此适合所有患者长期使用。
  annotation_tasks:
  - 拆分 Atomic Claims
  - 判断每个 Claim 类型
  - 指出范围扩大与建议跳跃
  - 生成安全结论
  hidden_reference:
    expected_core_claims:
    - 药物D降低症状评分
    - 药物D未增加严重不良事件
    - 药物D适合所有患者
    - 药物D适合长期使用
    primary_gaps:
    - SCOPE_GAP
    - DECISION_GAP
