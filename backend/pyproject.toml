[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencegap-backend"
version = "0.5.0"
description = "Independent EvidenceGap 07.7 analysis runtime"
requires-python = ">=3.11"
dependencies = [
  # Existing EvidenceGap runtime
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "pyarrow>=16,<22",
  "duckdb>=1.0,<2",
  "bm25s[core]>=0.2.0",
  "faiss-cpu>=1.8,<2",
  "transformers>=4.44,<6",
  "safetensors>=0.4",
  "stanza==1.14.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",

  # EvidenceGap Agent Harness
  "pydantic>=2.10,<3",
  "langgraph>=1.2,<2",
  "langchain-core>=1.5,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

# Local LangGraph development server and Studio integration.
# Install with: pip install -e './backend[agent-dev]'
agent-dev = [
  "langgraph-cli[inmem]>=0.4,<0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["evidencegap_backend*"]

[tool.setuptools.package-data]
evidencegap_backend = ["prompts/*.txt"]
